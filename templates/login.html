{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<h2>로그인</h2>
<form method="POST" action="{{ url_for('login') }}">
    <p><label>이메일</label><br><input type="email" name="email" required autocomplete="email"></p>
    <p><label>비밀번호</label><br><input type="password" name="password" required autocomplete="current-password"></p>
    <button type="submit">로그인</button>
</form>
<p>계정이 없으신가요? <a href="{{ url_for('register') }}">회원가입</a></p>
{% endblock %}
